[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Polices : mises en cache longtemps (elles ne changent jamais).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# L'ancienne page Professionnels (supprimée en octobre 2026) mène aux projets, filtre « Professionnels » activé.
[[redirects]]
  from = "/professionnels"
  to = "/projets?type=professionnels"
  status = 301
